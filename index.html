<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascentio</title>
  <meta name="description" content="Ascentio — software development.">
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --accent: #2f6fde; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; --accent: #7aa7ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
           font-family: system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 36rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .25rem; letter-spacing: -.02em; }
    p { line-height: 1.6; color: var(--muted); }
    a { color: var(--accent); }
    nav { margin-top: 2rem; display: flex; gap: 1.25rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Ascentio</h1>
    <p>Software development. Een nieuwe website volgt binnenkort.</p>
    <nav>
      <a href="mailto:dvhulst@gmail.com">Contact</a>
      <a href="mail-summary/">AI mail summary</a>
    </nav>
  </main>
</body>
</html>
